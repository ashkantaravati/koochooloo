[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koochooloo"
version = "0.1.0"
description = "A self-hosted URL shortener built with Django and Django REST Framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Koochooloo Contributors" }
]
keywords = ["django", "url-shortener", "redirect"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "Django==4.2.16",
  "djangorestframework==3.15.2",
  "django-environ==0.11.2",
  "django-hashid-field==3.4.1",
  "hashids==1.3.1",
  "gunicorn==22.0.0",
]

[project.urls]
Homepage = "https://github.com/ashkantaravati/koochooloo"
Repository = "https://github.com/ashkantaravati/koochooloo"
Issues = "https://github.com/ashkantaravati/koochooloo/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["koochooloo*", "redirect*", "servables*"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
